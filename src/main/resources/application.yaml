spring:
  application:
    name: playlist

  config:
    import: "file:./.env[.properties]"

  security:
    oauth2:
      client:
        registration:
          # kakao 등록 이름이 시작·콜백 경로에 사용됩니다.
          kakao:
            # 앱의 REST API 키를 환경변수로 받습니다. 회원용 API Key와 다릅니다.
            client-id: ${KAKAO_CLIENT_ID}
            # 토큰 교환의 서버용 비밀값을 받습니다. 실제 값을 이 파일에 쓰지 않습니다.
            client-secret: ${KAKAO_CLIENT_SECRET}
            # client_secret_post: 토큰 POST 폼에 시크릿을 보냅니다.
            client-authentication-method: client_secret_post
            # authorization_code: 인가 코드를 토큰으로 교환합니다.
            authorization-grant-type: authorization_code
            # Spring이 두 자리 값을 채웁니다. 콘솔의 콜백 URI와 같아야 합니다.
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            # 외부에서 요청할 정보 범위이며 우리 서비스의 STAFF 역할이 아닙니다.
            scope: profile_nickname
            # 화면 표시용 등록 이름입니다. 로컬 회원 id를 만드는 값이 아닙니다.
            client-name: Kakao
        # 인가·토큰·사용자 정보 주소를 지정합니다.
        provider:
          # 같은 kakao 이름의 registration이 사용할 주소 묶음입니다.
          kakao:
            # 브라우저를 보내 로그인·동의를 받는 주소입니다.
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            # 우리 서버가 code를 접근 토큰으로 교환하는 주소입니다.
            token-uri: https://kauth.kakao.com/oauth/token
            # 카카오 접근 토큰으로 외부 사용자 정보를 읽는 주소입니다.
            user-info-uri: https://kapi.kakao.com/v2/user/me
            # header: 사용자 조회의 Authorization에 카카오 Bearer를 넣습니다.
            user-info-authentication-method: header
            # 응답의 id를 외부 식별자로 읽습니다. 우리 loginId는 아직 아닙니다.
            user-name-attribute: id


  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none

playlist:
  jwt:
    # 로컬 개발용 기본값. 운영 환경에서는 반드시 JWT_SECRET 환경 변수로 덮어쓸 것 (32바이트 이상)
    secret: ${JWT_SECRET:local-dev-only-jwt-secret-change-me-in-production}
    access-seconds: 1800
    refresh-seconds: 604800
  cors:
    origin: ${CORS_ORIGIN:http://127.0.0.1:5173}
  cookie:
    # 로컬 http 환경에서는 false, 운영(https)에서는 COOKIE_SECURE=true로 덮어쓸 것
    secure: ${COOKIE_SECURE:false}
    # 쿠키를 쓰는 POST(재발급·로그아웃)를 허용할 Origin 목록 (쉼표로 구분)
    # localhost와 127.0.0.1은 Origin 문자열이 다르므로 둘 다 등록한다.
    allowed-origins: ${COOKIE_ALLOWED_ORIGINS:http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:8000,http://localhost:8000}
